name: Build VST3

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: models
        shell: pwsh
        run: ./scripts/fetch-models.ps1

      - name: rust
        uses: dtolnay/rust-toolchain@stable

      - name: build
        shell: pwsh
        run: cargo xtask bundle voiceguard --release

      - name: runtime
        shell: pwsh
        run: |
          $bundle = 'target/bundled/VoiceGuard.vst3/Contents/x86_64-win'
          $dll = Get-ChildItem -Path target -Recurse -Filter onnxruntime.dll | Select-Object -First 1
          if ($dll) {
            Copy-Item $dll.FullName $bundle -Force
          } else {
            Write-Error 'onnxruntime.dll not found'
          }

      - name: validate
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip' -OutFile pluginval.zip
          Expand-Archive pluginval.zip pluginval
          .\pluginval\pluginval.exe --strictness-level 5 --validate-in-process --validate "target/bundled/VoiceGuard.vst3"

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: VoiceGuard
          path: target/bundled/VoiceGuard.vst3
          if-no-files-found: error

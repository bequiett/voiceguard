name: Build VST3

on:
  workflow_dispatch:
  push:
    branches: [main, v0.2]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: models
        shell: pwsh
        run: ./scripts/fetch-models.ps1

      - name: rust
        uses: dtolnay/rust-toolchain@stable

      - name: build
        shell: pwsh
        run: cargo xtask bundle voiceguard --release

      - name: runtime
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/microsoft/onnxruntime/releases/download/v1.28.0/onnxruntime-win-x64-1.28.0.zip' -OutFile onnxruntime.zip
          Expand-Archive onnxruntime.zip onnxruntime
          Copy-Item 'onnxruntime/onnxruntime-win-x64-1.28.0/lib/onnxruntime.dll' 'target/bundled/voiceguard.vst3/Contents/x86_64-win/' -Force

      - name: validate
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip' -OutFile pluginval.zip
          Expand-Archive pluginval.zip pluginval
          .\pluginval\pluginval.exe --strictness-level 5 --validate-in-process --validate "target/bundled/voiceguard.vst3"

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: VoiceGuard
          path: target/bundled/voiceguard.vst3
          if-no-files-found: error

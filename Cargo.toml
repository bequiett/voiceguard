[workspace]
members = ["xtask"]
resolver = "2"

[package]
name = "voiceguard"
version = "0.3.1"
edition = "2021"
authors = ["bequiett"]
license = "AGPL-3.0-only"
description = "Real-time microphone cleanup VST3"

[lib]
crate-type = ["cdylib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "f36931f7af4646065488a9845d8f8c2f95252c23" }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "f36931f7af4646065488a9845d8f8c2f95252c23" }
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["load-dynamic"] }
crossbeam-channel = "0.5"
realfft = "3.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
